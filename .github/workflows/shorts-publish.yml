name: Shorts Publish (YouTube + TikTok + Facebook)

# YouTube Shorts lane only. Started by Claude's Shorts task through the GitHub API. No timer, no pull_request trigger.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test login only, private = private test upload, live = schedule at slot, now = public now, retry = repair failed, thumbs = re-set YouTube thumbnails"
        type: choice
        options: [check, private, live, now, retry, thumbs]
        default: check

permissions: {}

concurrency:
  group: shorts-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'exportain24-beep' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write          # results on shorts-state + temporary release asset for TikTok
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break
            echo "apt retry $i"; sleep 10
          done
          command -v ffprobe
      - name: Publish
        env:
          MODE: ${{ inputs.mode }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}          # YouTube (direct API) + Buffer (TikTok) only
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}               # Facebook Page Reels (same Page secrets as the reel system)
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}                   # this run's token: temporary release asset for Buffer
        run: python3 scripts/shorts_publish.py
