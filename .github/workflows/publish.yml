name: Publish (YouTube, Facebook, TikTok)

# Started by Claude's daily task through the GitHub API. No timer, no pull_request trigger.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test logins only, private = YouTube private + Facebook draft, live = schedule posts, now = publish immediately, retry = repair failed platforms"
        type: choice
        options: [check, private, live, now, retry]
        default: check

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'exportain24-beep' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write          # to record results on the 'state' branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Publish
        env:
          MODE: ${{ inputs.mode }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/publish.py
