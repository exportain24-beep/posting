name: Test ElevenLabs voice

# Manual only. Generates one short sample so you can check the key, the voice and the model.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "ElevenLabs model"
        type: choice
        options: [eleven_v4_turbo, eleven_v4]
        default: eleven_v4_turbo
      text:
        description: "Bangla text to speak (leave empty for the default test line)"
        type: string
        required: false

permissions: {}

jobs:
  voice:
    if: github.repository_owner == 'exportain24-beep' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Generate sample
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MODEL: ${{ inputs.model }}
          TEXT: ${{ inputs.text }}
        run: python3 scripts/voice_test.py voice-test/sample.mp3 --model "$MODEL" --text "$TEXT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-sample
          path: voice-test/sample.mp3
          retention-days: 7
