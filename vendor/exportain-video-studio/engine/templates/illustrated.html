<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#fff}
#st{position:relative;width:100%;height:100%;overflow:hidden;background:#eef3f1}
.scene{position:absolute;inset:0;display:none}
.scene>svg{width:100%;height:100%;display:block}
[data-k]{transform-box:fill-box;transform-origin:center}
#badge{position:absolute;left:5.5%;top:3.6%;height:4.2%;padding:.6% 2.2%;background:#fff;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.18);z-index:50;display:flex;align-items:center}
#badge img{height:100%}
#intro,#end{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;opacity:0;background:radial-gradient(70% 50% at 50% 48%,#ffffff,#e6efe9)}
#intro img,#end img{width:74%}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:6px solid #1f8a3a;transform:translate(-50%,-50%);opacity:0}
.ring.r2{border-color:#7cc242}
.shine{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.shine i{position:absolute;top:-10%;bottom:-10%;width:18%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg)}
.lw{position:relative;width:74%;display:flex}.lw img{width:100%}
#grain{position:absolute;inset:0;opacity:.045;pointer-events:none;z-index:90;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;background:radial-gradient(85% 75% at 50% 45%,transparent 62%,rgba(0,0,0,.22));pointer-events:none;z-index:80}
</style></head>
<body><div id="st">
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d93c6"/><stop offset=".55" stop-color="#a9cbe4"/><stop offset="1" stop-color="#f3d9b8"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7e98"/><stop offset="1" stop-color="#173f57"/></linearGradient>
 <linearGradient id="quay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6adb3"/><stop offset="1" stop-color="#737c84"/></linearGradient>
 <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f9f7"/><stop offset="1" stop-color="#dbe7e0"/></linearGradient>
 <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123049"/><stop offset="1" stop-color="#081a2a"/></linearGradient>
 <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc242"/><stop offset="1" stop-color="#1f7a35"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3f0"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4552"/><stop offset=".5" stop-color="#5a6774"/><stop offset="1" stop-color="#2c3540"/></linearGradient>
 <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6dc"/><stop offset=".3" stop-color="#ffe2a6" stop-opacity=".8"/><stop offset="1" stop-color="#ffe2a6" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7cc242" stop-opacity=".7"/><stop offset="1" stop-color="#7cc242" stop-opacity="0"/></radialGradient>
 <radialGradient id="podium" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#3a5368"/><stop offset="1" stop-color="#16293a"/></radialGradient>
 <pattern id="ridge" width="11" height="10" patternUnits="userSpaceOnUse"><rect width="3" height="10" fill="rgba(0,0,0,.18)"/><rect x="3" width="1.5" height="10" fill="rgba(255,255,255,.08)"/></pattern>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b2233" flood-opacity=".28"/></filter>
 <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b2233" flood-opacity=".3"/></filter>
 <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

 <radialGradient id="bulbG" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#fffde7"/><stop offset=".6" stop-color="#ffe082"/><stop offset="1" stop-color="#ffb300"/></radialGradient>
 <linearGradient id="c_peach" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#ffe0c2"/><stop offset="1" stop-color="#ffb199"/></linearGradient>
 <linearGradient id="c_mint" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#e0f7d4"/><stop offset="1" stop-color="#9be3b8"/></linearGradient>
 <linearGradient id="c_sky" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#d6ecff"/><stop offset="1" stop-color="#9cc9ff"/></linearGradient>
 <linearGradient id="c_lilac" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#efe1ff"/><stop offset="1" stop-color="#b9a2ff"/></linearGradient>
 <linearGradient id="c_lemon" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff9d6"/><stop offset="1" stop-color="#ffd76e"/></linearGradient>
 <linearGradient id="c_coral" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#ffe3e8"/><stop offset="1" stop-color="#ff9fb2"/></linearGradient>
 <linearGradient id="c_aqua" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#d9fbf6"/><stop offset="1" stop-color="#7fdcd0"/></linearGradient>
 <linearGradient id="c_deep" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#3a1c71"/><stop offset=".55" stop-color="#4b3fb0"/><stop offset="1" stop-color="#1b6fa8"/></linearGradient>
 <linearGradient id="c_ocean" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#0b3d5c"/><stop offset="1" stop-color="#0f7b6c"/></linearGradient>
</defs></svg>
<div id="scenes"></div>
<div id="badge"><img id="badgeimg"></div>
<div id="intro"><div class="ring r1"></div><div class="ring r2"></div><div class="lw"><img class="lg"><div class="shine"><i></i></div></div></div>
<div id="end"><div class="ring r1"></div><div class="ring r2"></div><div class="lw"><img class="lg"><div class="shine"><i></i></div></div></div>
<div id="vig"></div><div id="grain"></div>
</div>
<script>
// ---------- math ----------
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), L=(a,b,t)=>a+(b-a)*t;
const eo=x=>x>=1?1:1-Math.pow(2,-10*x), eb=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, es=x=>x*x*(3-2*x);
function T(el,o){if(!el)return;const{x=0,y=0,s=1,r=0}=o;el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;if(o.o!==undefined)el.style.opacity=o.o}
function O(el,o){if(el)el.style.opacity=o}
const COL=['#b5452f','#2c5aa0','#2f7d4a','#d9822b','#7a8a99','#8e3b5a','#c9a227'];
const BRAND='#1f8a3a', BR2='#7cc242';
let LOGO='';

// ---------- asset library (SVG strings) ----------
function cont(x,y,w,h,c){return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#ridge)"/><rect x="${x}" y="${y}" width="${w}" height="${h*.16}" fill="#fff" opacity=".14"/><rect x="${x+.5}" y="${y+.5}" width="${w-1}" height="${h-1}" rx="3" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="2"/></g>`}
function ship(){let s='';for(let r=0;r<3;r++)for(let c=0;c<10;c++){if(r==2&&(c<1||c>8))continue;s+=cont(110+c*58,-50*(r+1),56,48,COL[(r*3+c*5)%6])}
 s+=`<rect x="700" y="-196" width="112" height="196" fill="#f1f1ee"/><rect x="700" y="-196" width="18" height="196" fill="#d9d9d4"/>`;
 for(let r=0;r<5;r++)s+=`<rect x="726" y="${-184+r*34}" width="78" height="12" rx="3" fill="#2a3b4c"/>`;
 s+=`<rect x="688" y="-212" width="136" height="18" rx="3" fill="#dededa"/><rect x="752" y="-262" width="40" height="52" fill="#b5452f"/><rect x="752" y="-270" width="40" height="12" fill="#1d1d1d"/>`;
 s+=`<path d="M0 0 L866 0 L818 124 L70 124 Q24 122 0 0Z" fill="#1e2a38"/><path d="M34 84 L832 84 L818 124 L70 124 Q46 121 34 84Z" fill="#8f2c2c"/><rect x="0" y="-5" width="866" height="7" fill="#e9e9e6"/><path d="M0 0 L866 0 L858 22 L6 22Z" fill="#fff" opacity=".07"/>`;
 return s}
function truck(){return `<ellipse cx="275" cy="4" rx="285" ry="16" fill="#000" opacity=".22" filter="url(#b8)"/>`+cont(0,-196,410,152,'#b5452f')+
 `<rect x="-6" y="-44" width="560" height="18" rx="4" fill="#2b2f33"/>
 <path d="M418 -26 L418 -150 Q418 -168 436 -168 L500 -168 Q520 -168 530 -150 L556 -100 L556 -26Z" fill="#2c5aa0"/>
 <path d="M440 -152 L496 -152 Q508 -152 514 -142 L534 -104 L440 -104Z" fill="#bcd6ea"/><path d="M440 -152 L470 -152 L450 -104 L440 -104Z" fill="#fff" opacity=".45"/>
 <rect x="418" y="-96" width="138" height="8" fill="#1f467f"/><rect x="540" y="-60" width="22" height="14" rx="3" fill="#ffd27a"/>
 ${[64,130,330,486].map(x=>`<circle cx="${x}" cy="-14" r="28" fill="#1a1c1e"/><circle cx="${x}" cy="-14" r="12" fill="#8b949c"/><circle cx="${x}" cy="-14" r="4" fill="#3a3f44"/>`).join('')}`}
function factory(flag=true){return `<ellipse cx="0" cy="6" rx="190" ry="14" fill="#000" opacity=".18" filter="url(#b8)"/>
 <rect x="-170" y="-150" width="340" height="150" fill="#e9e4da"/><rect x="-170" y="-150" width="340" height="150" fill="url(#ridge)" opacity=".25"/>
 <path d="M-170 -150 L-170 -205 L-85 -150 L-85 -205 L0 -150 L0 -205 L85 -150 L85 -205 L170 -150Z" fill="#8a96a3"/>
 <path d="M-170 -205 L-85 -150 L-85 -160Z M-85 -205 L0 -150 L0 -160Z M0 -205 L85 -150 L85 -160Z" fill="#b8c2cc"/>
 <rect x="110" y="-280" width="34" height="130" fill="#9aa4ad"/><rect x="106" y="-288" width="42" height="12" fill="#7d8790"/>
 ${[-140,-80,-20,40].map(x=>`<rect x="${x}" y="-118" width="44" height="40" rx="3" fill="#36597a"/><rect x="${x}" y="-118" width="44" height="12" fill="#fff" opacity=".18"/>`).join('')}
 <rect x="80" y="-70" width="70" height="70" fill="#5b6670"/>
 ${flag?`<line x1="-150" y1="-150" x2="-150" y2="-270" stroke="#555" stroke-width="5"/><rect x="-148" y="-270" width="80" height="48" fill="#006a4e"/><circle cx="-112" cy="-246" r="15" fill="#f42a41"/>`:''}
 <g data-k="smoke">${[0,1,2].map(i=>`<circle cx="127" cy="${-300-i*40}" r="${18+i*8}" fill="#cfd5da" opacity="${.7-i*.2}"/>`).join('')}</g>`}
function doc(){return `<g filter="url(#sh)"><rect x="-210" y="-280" width="420" height="560" rx="18" fill="#fdfdfb"/></g>
 <rect x="-210" y="-280" width="420" height="90" rx="18" fill="#eef4f0"/><rect x="-210" y="-210" width="420" height="20" fill="#eef4f0"/>
 <circle cx="-140" cy="-235" r="28" fill="none" stroke="${BRAND}" stroke-width="6"/><path d="M-152 -235 l9 9 l18 -20" fill="none" stroke="${BRAND}" stroke-width="6" stroke-linecap="round"/>
 ${[0,1,2,3,4,5].map(i=>`<rect x="-160" y="${-140+i*52}" width="${[320,260,300,220,290,180][i]}" height="16" rx="8" fill="#d6dde2"/>`).join('')}
 <g data-k="stamp"><g transform="rotate(-14 90 175)"><rect x="10" y="125" width="160" height="100" rx="14" fill="none" stroke="#c0392b" stroke-width="8"/><circle cx="90" cy="175" r="30" fill="none" stroke="#c0392b" stroke-width="7"/><path d="M74 175 l12 12 l22 -26" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/></g></g>`}
function avatar(cx,cy,r,c){const id='av'+Math.round(cx*7+cy*3+r);return `<g filter="url(#sh2)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/></g><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
 <g clip-path="url(#${id})"><circle cx="${cx}" cy="${cy-r*.18}" r="${r*.34}" fill="#fff" opacity=".95"/><ellipse cx="${cx}" cy="${cy+r*.78}" rx="${r*.62}" ry="${r*.5}" fill="#fff" opacity=".95"/></g>
 <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-width="${r*.12}"/>`}
function pin(c){return `<g filter="url(#sh2)"><path d="M0 0 C-8 -18 -30 -34 -30 -58 A30 30 0 1 1 30 -58 C30 -34 8 -18 0 0Z" fill="${c}"/></g><circle cx="0" cy="-58" r="12" fill="#fff"/>`}
const IC={ // 100x100 stroke icons
 ship:'<path d="M10 62h80l-10 18H20z"/><path d="M24 62V48h52v14"/><path d="M34 48V38h28v10"/><path d="M50 38V22"/>',
 truck:'<rect x="8" y="34" width="52" height="34" rx="3"/><path d="M60 46h18l12 14v8H60z"/><circle cx="26" cy="74" r="7"/><circle cx="74" cy="74" r="7"/>',
 doc:'<rect x="24" y="12" width="52" height="76" rx="6"/><path d="M34 30h32M34 44h32M34 58h20"/><path d="M38 72l7 7 15-16"/>',
 shirt:'<path d="M34 16l-22 12 8 18 10-4v42h40V42l10 4 8-18-22-12c-2 8-8 12-16 12s-14-4-16-12z"/>',
 shoe:'<path d="M10 62c0-14 4-28 8-30l18 6c4 8 14 10 24 12 14 2 28 6 30 14v8H10z"/><path d="M10 70h80"/>',
 bag:'<rect x="18" y="34" width="64" height="52" rx="6"/><path d="M36 34v-8a14 14 0 0 1 28 0v8"/>',
 box:'<path d="M50 12l36 16v44L50 88 14 72V28z"/><path d="M14 28l36 16 36-16M50 44v44"/>',
 phone:'<path d="M28 14h14l6 18-9 7c5 10 12 17 22 22l7-9 18 6v14c0 6-5 10-11 10C45 82 18 55 18 25c0-6 4-11 10-11z"/>',
 mail:'<rect x="12" y="24" width="76" height="52" rx="6"/><path d="M14 28l36 28 36-28"/>',
 mappin:'<path d="M50 88S22 58 22 38a28 28 0 0 1 56 0c0 20-28 50-28 50z"/><circle cx="50" cy="38" r="10"/>',
 globe:'<circle cx="50" cy="50" r="36"/><ellipse cx="50" cy="50" rx="15" ry="36"/><path d="M14 50h72M20 32h60M20 68h60"/>',
 check:'<path d="M24 52l17 17 35-38"/>',
 cart:'<path d="M10 18h12l10 46h46l8-32H28"/><circle cx="38" cy="78" r="6"/><circle cx="72" cy="78" r="6"/>',
 lock:'<rect x="22" y="44" width="56" height="42" rx="6"/><path d="M34 44V32a16 16 0 0 1 32 0v12"/><circle cx="50" cy="64" r="5"/>',
 cal:'<rect x="14" y="20" width="72" height="66" rx="8"/><path d="M14 40h72M32 12v16M68 12v16"/><path d="M36 62l10 10 20-20"/>',
 bld:'<rect x="22" y="20" width="56" height="68" rx="3"/><path d="M34 34h8M58 34h8M34 50h8M58 50h8M44 88V70h12v18"/>',
 star:'<path d="M50 12l11 24 26 3-19 18 5 26-23-13-23 13 5-26-19-18 26-3z"/>',
 chat:'<path d="M16 22h68v42H44L28 80V64H16z"/>',
 hand:'<path d="M8 50l18-14 16 6 10-6 16 6 16-6 8 10"/><path d="M26 36l22 30c4 6 12 2 9-5M40 62c4 6 12 2 9-5M52 70c4 6 12 1 9-5"/>',
 arrow:'<path d="M18 50h60M56 28l22 22-22 22"/>',
 linkb:'<path d="M42 30l8-8a16 16 0 0 1 22 22l-8 8M58 70l-8 8a16 16 0 0 1-22-22l8-8"/><path d="M30 18l6 10M18 32l10 4M82 68l-10-4M70 82l-6-10"/>'
};
function icon(name,x,y,size,col,w=6){return `<g transform="translate(${x-size/2} ${y-size/2}) scale(${size/100})" fill="none" stroke="${col}" stroke-width="${w*100/size*size/100}" stroke-linecap="round" stroke-linejoin="round">${IC[name]}</g>`}
function chip(name,x,y,r,bg,fg='#fff'){return `<g filter="url(#sh2)"><circle cx="${x}" cy="${y}" r="${r}" fill="${bg}"/></g>`+icon(name,x,y,r*1.15,fg,7)}
function card(x,y,w,h,inner='',rx=26){return `<g filter="url(#sh)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="#fff"/></g>${inner}`}
function skel(x,y,ws,gap=34,h=14,c='#dfe5e9'){return ws.map((w,i)=>`<rect x="${x}" y="${y+i*gap}" width="${w}" height="${h}" rx="${h/2}" fill="${c}"/>`).join('')}

// ---------- dotted world map ----------
const LAND={80:[[-70,-20],[10,30],[50,100]],75:[[-95,-75],[-65,-20],[55,140]],70:[[-165,-60],[-55,-25],[20,180]],65:[[-170,-60],[-50,-35],[-25,-13],[10,180]],60:[[-165,-60],[-48,-42],[5,180]],55:[[-165,-130],[-125,-60],[-10,0],[8,140],[155,165]],50:[[-130,-55],[-5,140]],45:[[-125,-60],[-5,145]],40:[[-125,-72],[-9,142]],35:[[-120,-76],[-8,10],[12,36],[40,140]],30:[[-117,-80],[-10,35],[45,122]],25:[[-112,-97],[-82,-80],[-15,35],[38,57],[60,120]],20:[[-105,-87],[-17,40],[42,57],[70,110]],15:[[-95,-83],[-17,42],[43,52],[75,80],[95,110],[120,125]],10:[[-85,-62],[-15,45],[77,80],[98,108],[120,126]],5:[[-80,-50],[-10,48],[100,104],[115,120]],0:[[-80,-48],[9,43],[100,140]],'-5':[[-80,-35],[11,40],[105,115],[120,150]],'-10':[[-78,-35],[13,40],[120,150]],'-15':[[-76,-38],[12,40],[44,50],[125,145]],'-20':[[-70,-40],[13,35],[44,48],[114,150]],'-25':[[-70,-45],[15,33],[114,153]],'-30':[[-72,-50],[17,31],[115,153]],'-35':[[-72,-56],[18,25],[117,150]],'-40':[[-73,-62],[145,148],[172,176]],'-45':[[-74,-66],[167,171]],'-50':[[-75,-68]]};
function mapper(x0,y0,w){const h=w/2;return {x0,y0,w,h,p:(lon,lat)=>[x0+(lon+180)/360*w,y0+(90-lat)/180*h]}}
function mapDots(m,col,r=3.2,step=3.6){let s='';for(let lat=82;lat>-56;lat-=step){const band=LAND[String(Math.max(-50,Math.min(80,Math.round(lat/5)*5)))]||[];
 for(let lon=-178;lon<180;lon+=step){if(band.some(([a,b])=>lon>=a&&lon<=b)){const[x,y]=m.p(lon,lat);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${col}"/>`}}}return s}
const CITY={us:[-95,38],ca:[-100,56],uk:[-2,53],de:[10,51],ae:[55,24],jp:[139,36],au:[145,-31],br:[-50,-12],za:[25,-28],cn:[110,33],bd:[90,24]};
function arc(m,a,b,lift=.35){const[x1,y1]=m.p(...CITY[a]),[x2,y2]=m.p(...CITY[b]);const mx=(x1+x2)/2,my=(y1+y2)/2-Math.hypot(x2-x1,y2-y1)*lift;return `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`}

// ---------- scene kinds ----------
// each returns {svg, init(root), upd(lt, t, bt)} ; bt(i) = local time of beat i
const K={};
K.port_roles=()=>({svg:`<rect width="1080" height="1060" fill="url(#sky)"/><circle data-k="sun" cx="820" cy="760" r="320" fill="url(#sun)"/>
 <g data-k="clouds" opacity=".85">${[[150,260,140],[520,180,190],[880,330,150],[330,470,110]].map(([x,y,r])=>`<g filter="url(#b3)"><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.32}" fill="#fff"/><ellipse cx="${x+r*.35}" cy="${y-r*.18}" rx="${r*.55}" ry="${r*.3}" fill="#fff"/></g>`).join('')}</g>
 <g filter="url(#b3)" opacity=".55">${Array.from({length:22},(_,i)=>`<rect x="${i*50}" y="${1000-(30+((i*37)%70))}" width="44" height="${30+((i*37)%70)}" fill="#8aa1b4"/>`).join('')}</g>
