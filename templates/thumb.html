<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(__FONTDIR__/NotoSansBengali-ExtraBold.ttf);font-weight:800}
@font-face{font-family:B;src:url(__FONTDIR__/NotoSansBengali-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(__FONTDIR__/Poppins-ExtraBold.ttf);font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
#t{position:relative;width:1280px;height:720px;background:linear-gradient(135deg,#003C10,#005A1E 55%,#2E8B2E);overflow:hidden;font-family:B,P}
.ring{position:absolute;border-radius:50%;border:40px solid rgba(92,191,20,.25)}
#logo{position:absolute;left:56px;top:46px;background:#fff;border-radius:999px;padding:12px 30px}
#logo img{height:54px;display:block}
#chip{position:absolute;left:60px;top:170px;background:#F2B705;color:#1b1400;font:800 40px B,P;padding:8px 26px;border-radius:999px}
#h{position:absolute;left:60px;right:330px;top:250px;color:#fff;font:800 86px/1.18 B,P;text-shadow:0 6px 24px rgba(0,0,0,.35)}
#h em{font-style:normal;color:#F2B705}
#sub{position:absolute;left:60px;bottom:48px;color:#DDF5CF;font:700 40px B,P}
#icon{position:absolute;right:60px;top:210px;font-size:260px;line-height:1}
</style></head>
<body><div id="t"><div class="ring" style="width:560px;height:560px;right:-160px;top:-120px"></div><div class="ring" style="width:420px;height:420px;right:120px;bottom:-260px"></div>
<div id="logo"><img id="li"></div><div id="chip"></div><div id="h"></div><div id="icon"></div><div id="sub"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
window.__init=function(p){document.getElementById('li').src=p.logo;
 document.getElementById('chip').textContent=p.chip||'';
 document.getElementById('h').innerHTML=esc(p.headline).replace(/\*(.+?)\*/g,'<em>$1</em>');
 document.getElementById('sub').textContent=p.sub||'';document.getElementById('icon').textContent=p.icon||'';
 if(!p.chip)document.getElementById('chip').style.display='none';};
</script></body></html>
