<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(__FONTDIR__/NotoSansBengali-Regular.ttf);font-weight:400}
@font-face{font-family:B;src:url(__FONTDIR__/NotoSansBengali-SemiBold.ttf);font-weight:600}
@font-face{font-family:B;src:url(__FONTDIR__/NotoSansBengali-Bold.ttf);font-weight:700}
@font-face{font-family:B;src:url(__FONTDIR__/NotoSansBengali-ExtraBold.ttf);font-weight:800}
@font-face{font-family:P;src:url(__FONTDIR__/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(__FONTDIR__/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(__FONTDIR__/Poppins-ExtraBold.ttf);font-weight:800}
:root{--green:#005A1E;--forest:#003C10;--lime:#5CBF14;--leaf:#2E8B2E;--gold:#F2B705;--teal:#0E8C88;--navy:#0B3B5C;--red:#D93636}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:P,B,sans-serif}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
/* themes */
.t-light{--bg1:#F4FAEF;--bg2:#DDEFD2;--ink:#0F2A17;--sub:#3C5A44;--card:#FFFFFF;--accent:var(--green);--accent2:var(--lime);--chipbg:var(--green);--chipink:#fff}
.t-dark{--bg1:#003C10;--bg2:#00290B;--ink:#FFFFFF;--sub:#CFE8C4;--card:rgba(255,255,255,.08);--accent:var(--lime);--accent2:var(--gold);--chipbg:var(--gold);--chipink:#1b1400}
.t-navy{--bg1:#0B3B5C;--bg2:#072A42;--ink:#FFFFFF;--sub:#C9E3F2;--card:rgba(255,255,255,.08);--accent:var(--gold);--accent2:var(--teal);--chipbg:var(--lime);--chipink:#062010}
#bg{position:absolute;inset:0;background:linear-gradient(165deg,var(--bg1),var(--bg2))}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.18}
#logo{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:18px 46px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
#logo img{height:96px;display:block}
.scene{position:absolute;left:70px;right:70px;top:380px;height:960px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.chip{align-self:flex-start;background:var(--chipbg);color:var(--chipink);font:700 44px B,P;padding:14px 34px;border-radius:999px;letter-spacing:.5px}
.title{color:var(--ink);font:800 112px/1.22 B,P;letter-spacing:-.5px}
.title em{font-style:normal;color:var(--accent)}
.body{color:var(--sub);font:600 56px/1.45 B,P}
.icon{font-size:190px;line-height:1}
.bul{display:flex;flex-direction:column;gap:22px}
.bi{display:flex;align-items:center;gap:26px;background:var(--card);border-radius:30px;padding:30px 36px;box-shadow:0 10px 30px rgba(0,0,0,.08);color:var(--ink);font:700 58px/1.3 B,P}
.bi .n{flex:none;width:86px;height:86px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:800 40px P,B}
.t-dark .bi .n,.t-navy .bi .n{color:#062010}
.stat{color:var(--accent);font:800 220px/1 P,B;letter-spacing:-4px}
.statlab{color:var(--ink);font:700 58px/1.35 B,P}
.cta .title{text-align:center}.cta{align-items:center;text-align:center}
.url{background:var(--accent);color:#fff;font:800 70px P;padding:26px 60px;border-radius:999px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.t-dark .url,.t-navy .url{color:#062010}
.ctasub{color:var(--sub);font:700 50px/1.4 B,P}
#cap{position:absolute;left:80px;right:150px;top:1400px;min-height:150px;display:flex;align-items:flex-start;justify-content:center}
#cap span{background:rgba(0,0,0,.78);color:#fff;font:700 54px/1.38 B,P;padding:16px 30px;border-radius:22px;text-align:center;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#bar{position:absolute;left:80px;right:150px;top:1365px;height:10px;border-radius:10px;background:rgba(0,0,0,.12);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent)}
</style>
</head>
<body>
<div id="st"><div id="bg"></div><div id="blobs"></div><div id="scenes"></div><div id="bar"><i></i></div><div id="cap"></div><div id="logo"><img id="logoimg"></div></div>
<script>
let P=null, S=[];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
window.__init=function(plan){
  P=plan; document.getElementById('st').className='t-'+(plan.theme||'light');
  document.getElementById('logoimg').src=plan.logo;
  const bl=document.getElementById('blobs');
  P.blobs=[[ -160,  260, 520,'var(--accent2)'],[700,1500,640,'var(--accent)'],[760,140,360,'var(--accent2)']].map(([x,y,r,c],i)=>{const b=el('div','blob');Object.assign(b.style,{left:x+'px',top:y+'px',width:r+'px',height:r+'px',background:c});bl.appendChild(b);return b});
  const root=document.getElementById('scenes');
  S=plan.scenes.map((sc,i)=>{
    const d=el('div','scene '+(sc.kind==='cta'?'cta':'')); const parts=[];
    const add=(e,delay)=>{d.appendChild(e);parts.push([e,delay]);};
    if(sc.icon) add(el('div','icon',esc(sc.icon)),0);
    if(sc.kicker) add(el('div','chip',esc(sc.kicker)),0.05);
    if(sc.kind==='stat'&&sc.stat){add(el('div','stat',esc(sc.stat.value)),0.15);add(el('div','statlab',hl(sc.stat.label)),0.35);}
    if(sc.title) add(el('div','title',hl(sc.title)),sc.kind==='stat'?0.55:0.12);
    if(sc.body) add(el('div','body',hl(sc.body)),0.4);
    if(sc.bullets&&sc.bullets.length){const b=el('div','bul');d.appendChild(b);
      const step=Math.min(1.1,(sc.dur-1.2)/Math.max(1,sc.bullets.length));
      sc.bullets.forEach((t,k)=>{const r=el('div','bi',`<span class="n">${k+1}</span><span>${hl(t)}</span>`);b.appendChild(r);parts.push([r,0.5+k*step]);});}
    if(sc.kind==='cta'){add(el('div','url',esc(sc.url||'exportain.com')),0.35); if(sc.sub) add(el('div','ctasub',hl(sc.sub)),0.6);}
    root.appendChild(d); return {sc,d,parts};
  });
};
window.__render=function(t){
  const T=P.total;
  P.blobs.forEach((b,i)=>{b.style.transform=`translate(${Math.sin(t*0.35+i*2)*40}px,${Math.cos(t*0.28+i)*50}px) scale(${1+0.06*Math.sin(t*0.5+i)})`});
  document.querySelector('#bar i').style.width=(clamp(t/T)*100)+'%';
  let cap='';
  S.forEach(({sc,d,parts},i)=>{
    const lt=t-sc.start, on=lt>=-0.001&&lt<sc.dur+0.001;
    d.style.display=on?'flex':'none'; if(!on)return;
    const out=clamp((sc.dur-lt)/0.25); // fade out at scene end
    d.style.opacity=(i===S.length-1)?1:out;
    parts.forEach(([e,delay])=>{
      // scene 1 is fully visible at t=0 so the first frame works as a cover
      const p=(i===0&&t<0.05)?1:eo((lt-delay)/0.45);
      e.style.opacity=p; e.style.transform=`translateY(${(1-p)*60}px) scale(${0.96+0.04*p})`;
    });
    (sc.captions||[]).forEach(c=>{if(lt>=c.t0&&lt<c.t1)cap=c.text;});
  });
  const ce=document.getElementById('cap'); if(ce.dataset.v!==cap){ce.dataset.v=cap;ce.innerHTML=cap?`<span>${esc(cap)}</span>`:'';}
};
</script>
</body>
</html>
